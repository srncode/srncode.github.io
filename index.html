<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Service - Welcome</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #1f2937;
            --text-sub: #4b5563;
            --bg-color: #f9fafb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .service-container {
            text-align: center;
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            max-width: 440px;
            width: 90%;
        }

        .logo-placeholder {
            width: 64px;
            height: 64px;
            background-color: #e0e7ff;
            color: var(--primary-color);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            margin: 0 auto 24px auto;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 0 12px 0;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-sub);
            font-size: 1rem;
            line-height: 1.6;
            margin: 0 0 32px 0;
        }

        .btn-primary {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .status-footer {
            margin-top: 32px;
            font-size: 0.85rem;
            color: #9ca3af;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .pulse-icon {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

    <div class="service-container">
        <div class="logo-placeholder">W</div>
        
        <h1>새로운 웹서비스가<br>준비 중입니다</h1>
        <p>GitHub Pages를 통해 성공적으로 웹 서버가 빌드되었습니다. 본격적인 서비스 개발을 시작해 보세요!</p>
        
        <a href="#" class="btn-primary" onclick="alert('서비스가 곧 준비됩니다!'); return false;">시작하기</a>
        
        <div class="status-footer">
            <span class="pulse-icon"></span> Service Status: Operational
        </div>
    </div>

</body>
</html>
