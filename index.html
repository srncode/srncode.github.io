<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EBS VOCA 암기장</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
    background:#f5f7fa;
}

h1{
    text-align:center;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    margin-top:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.word{
    font-size:36px;
    font-weight:bold;
    text-align:center;
    color:#1f4e79;
    margin:20px 0;
}

input[type="text"]{
    width:100%;
    padding:12px;
    font-size:18px;
    box-sizing:border-box;
}

button{
    padding:10px 15px;
    margin-top:10px;
    cursor:pointer;
}

.correct{
    color:green;
    font-weight:bold;
}

.wrong{
    color:red;
    font-weight:bold;
}

#progress{
    font-size:18px;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>📖 EBS VOCA 암기장</h1>

<div class="card">

```
<label>DAY 입력 (1~30)</label>

<input
    type="number"
    id="dayInput"
    min="1"
    max="30"
    placeholder="예: 1">

<br>

<button onclick="loadDay()">학습 시작</button>
```

</div>

<div id="quizArea" class="card" style="display:none;">

```
<div id="progress"></div>

<div class="word" id="word"></div>

<input
    type="text"
    id="answer"
    placeholder="뜻을 입력하세요">

<button onclick="checkAnswer()">정답 확인</button>

<div id="result"></div>
```

</div>

<div id="summary" class="card" style="display:none;"></div>

<script>

let vocabData = [];
let quizList = [];

let currentIndex = 0;
let score = 0;
let wrongWords = [];
let wrongCount = 0;

const TOTAL_QUESTIONS = 30;

window.onload = async function(){

    try{

        const response = await fetch("voca.csv");

        const text = await response.text();

        parseCSV(text);

        console.log("단어장 로드 완료");

    }catch(error){

        alert("voca.csv 파일을 읽을 수 없습니다.");

        console.error(error);
    }

    document
        .getElementById("answer")
        .addEventListener("keypress",function(e){

            if(e.key==="Enter"){
                checkAnswer();
            }

        });

};

function parseCSV(text){

    const lines =
        text.split(/\r?\n/)
            .filter(line => line.trim());

    vocabData = [];

    for(let i=1;i<lines.length;i++){

        const cols = lines[i].split(",");

        if(cols.length < 3) continue;

        const day = cols[0].trim();
        const word = cols[1].trim();
        const meaning =
            cols.slice(2).join(",").trim();

        vocabData.push({
            day,
            word,
            meaning
        });
    }

}

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j =
            Math.floor(Math.random()*(i+1));

        [array[i],array[j]]
            =
        [array[j],array[i]];
    }

    return array;
}

function loadDay(){

    let day =
        document.getElementById("dayInput").value;

    if(!day){

        alert("DAY를 입력하세요.");

        return;
    }

    day =
        "Day" +
        String(day).padStart(2,"0");

    const dayWords =
        vocabData.filter(
            item => item.day === day
        );

    if(dayWords.length===0){

        alert("해당 DAY 데이터가 없습니다.");

        return;
    }

    quizList =
        shuffle([...dayWords])
        .slice(
            0,
            Math.min(
                TOTAL_QUESTIONS,
                dayWords.length
            )
        );

    currentIndex = 0;
    score = 0;
    wrongWords = [];

    document.getElementById("summary").style.display="none";

    document.getElementById("quizArea").style.display="block";

    showQuestion();

}

function showQuestion(){

    if(currentIndex >= quizList.length){

        finishQuiz();

        return;
    }

    wrongCount = 0;

    document.getElementById("answer").value="";

    document.getElementById("result").innerHTML="";

    document.getElementById("progress").innerHTML=
        `${currentIndex+1} / ${quizList.length}`;

    document.getElementById("word").innerHTML=
        quizList[currentIndex].word;

    document.getElementById("answer").focus();

}

function cleanMeaning(text){

    return text
        .replace(/\b[a-z]+\./gi,"")
        .replace(/[()]/g,"")
        .replace(/\s+/g,"")
        .trim();

}

function isCorrectAnswer(userInput, meaning){

    userInput =
        cleanMeaning(userInput);

    const answers =
        cleanMeaning(meaning)
            .split(",");

    return answers.some(answer =>

        answer.includes(userInput) ||
        userInput.includes(answer)

    );

}

function checkAnswer(){

    const input =
        document.getElementById("answer").value;

    if(!input.trim()) return;

    const current =
        quizList[currentIndex];

    if(
        isCorrectAnswer(
            input,
            current.meaning
        )
    ){

        score++;

        document.getElementById("result").innerHTML=
            "<p class='correct'>정답!</p>";

        setTimeout(()=>{

            currentIndex++;

            showQuestion();

        },800);

    }else{

        wrongCount++;

        if(wrongCount >= 2){

            wrongWords.push(current);

            document.getElementById("result").innerHTML=
            `
            <p class="wrong">
            오답<br>
            정답 : ${current.meaning}
            </p>
            `;

            setTimeout(()=>{

                currentIndex++;

                showQuestion();

            },2000);

        }else{

            document.getElementById("result").innerHTML=
            `
            <p class="wrong">
            틀렸습니다.
            한 번 더 시도하세요.
            </p>
            `;
        }

    }

}

function finishQuiz(){

    document.getElementById("quizArea").style.display="none";

    const accuracy =
        ((score/quizList.length)*100)
        .toFixed(1);

    let html =

    `
    <h2>학습 결과</h2>

    <p>총 문제 : ${quizList.length}</p>

    <p>정답 : ${score}</p>

    <p>오답 : ${wrongWords.length}</p>

    <p>정답률 : ${accuracy}%</p>
    `;

    if(wrongWords.length > 0){

        html +=
        `
        <button onclick="retryWrong()">
        틀린 문제 다시 풀기
        </button>
        `;
    }

    document.getElementById("summary").innerHTML=
        html;

    document.getElementById("summary").style.display="block";

}

function retryWrong(){

    quizList = [...wrongWords];

    currentIndex = 0;

    score = 0;

    wrongWords = [];

    document.getElementById("summary").style.display="none";

    document.getElementById("quizArea").style.display="block";

    showQuestion();

}

</script>

</body>
</html>
