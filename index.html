<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <style>
        /* 기본 리셋 스타일 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: #202124;
        }

        /* 상단 네비게이션 바 */
        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 24px;
            font-size: 13px;
        }

        header a {
            text-decoration: none;
            color: rgba(0,0,0,0.87);
            margin-right: 15px;
        }

        header a:hover {
            text-decoration: underline;
        }

        .sign-in-btn {
            background-color: #1a73e8;
            color: white;
            padding: 9px 23px;
            border-radius: 4px;
            font-weight: bold;
            text-decoration: none;
            transition: background 0.2s;
        }

        .sign-in-btn:hover {
            background-color: #1557b0;
            text-decoration: none;
        }

        /* 메인 콘텐츠 영역 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 100px; /* 푸터 공간 확보를 위한 여백 */
        }

        /* 구글 로고 */
        .logo {
            font-size: 90px;
            font-weight: 500;
            letter-spacing: -2px;
            margin-bottom: 30px;
            user-select: none;
        }
        .g1 { color: #4285F4; }
        .o1 { color: #EA4335; }
        .o2 { color: #FBBC05; }
        .g2 { color: #4285F4; }
        .l  { color: #34A853; }
        .e  { color: #EA4335; }

        /* 검색창 영역 */
        .search-container {
            width: 100%;
            max-width: 584px;
            position: relative;
        }

        .search-box {
            width: 100%;
            height: 46px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0 45px 0 45px;
            font-size: 16px;
            outline: none;
            transition: box-shadow 0.2s;
        }

        .search-box:hover, .search-box:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        /* 검색창 내부 아이콘들 (돋보기 및 마이크 마크 대체) */
        .search-icon {
            position: absolute;
            left: 15px;
            top: 14px;
            color: #9aa0a6;
            width: 20px;
            height: 20px;
        }

        .mic-icon {
            position: absolute;
            right: 15px;
            top: 13px;
            color: #4285F4;
            cursor: pointer;
        }

        /* 버튼 영역 */
        .button-container {
            margin-top: 28px;
        }

        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            margin: 5px;
            padding: 0 16px;
            line-height: 34px;
            height: 36px;
            min-width: 54px;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        .btn:hover {
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            color: #202124;
        }

        /* 하단 푸터 영역 */
        footer {
            background-color: #f2f2f2;
            font-size: 14px;
            color: #70757a;
            border-top: 1px solid #e4e4e4;
        }

        .footer-top {
            padding: 15px 30px;
            border-bottom: 1px solid #e4e4e4;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            padding: 15px 30px;
        }

        .footer-bottom a {
            text-decoration: none;
            color: #70757a;
            margin-right: 30px;
        }

        .footer-bottom a:hover {
            text-decoration: underline;
        }

        .footer-right {
            margin-right: -30px; /* 우측 정렬 맞춤 */
        }
    </style>
</head>
<body>

    <header>
        <a href="#">Gmail</a>
        <a href="#">이미지</a>
        <a href="#" style="margin-right: 20px; font-size: 16px;">⣿</a>
        <a href="#" class="sign-in-btn">로그인</a>
    </header>

    <main>
        <div class="logo">
            <span class="g1">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span>
        </div>

        <div class="search-container">
            <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
            
            <input type="text" class="search-box" autofocus>
            
            <span class="mic-icon">🎙️</span>
        </div>

        <div class="button-container">
            <button class="btn">Google 검색</button>
            <button class="btn">I'm Feeling Lucky</button>
        </div>
    </main>

    <footer>
        <div class="footer-top">
            대한민국
        </div>
        <div class="footer-bottom">
            <div class="footer-left">
                <a href="#">구글 정보</a>
                <a href="#">광고</a>
                <a href="#">비즈니스</a>
                <a href="#">검색의 원리</a>
            </div>
            <div class="footer-right">
                <a href="#">개인정보처리방침</a>
                <a href="#">약관</a>
                <a href="#">설정</a>
            </div>
        </div>
    </footer>

</body>
</html>
