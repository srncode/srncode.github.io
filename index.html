<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EBS VOCA 1800</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222536;
    --border: #2e3248;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --success: #22c55e;
    --error: #ef4444;
    --warn: #f59e0b;
    --text: #e8e9f0;
    --text2: #9095b0;
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p { color: var(--text2); font-size: 0.9rem; margin-top: 4px; }

  /* ── 탭 네비 ── */
  .tab-nav {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    width: 100%;
    max-width: 560px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text2);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #fff;
  }
  .tab-btn:not(.active):hover { color: var(--text); background: var(--surface2); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    width: 100%;
    max-width: 560px;
  }

  .hidden { display: none !important; }

  /* ── Day 그리드 (공통) ── */
  .section-label {
    display: block;
    font-size: 0.82rem;
    color: var(--text2);
    margin-bottom: 10px;
    font-weight: 500;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .day-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 7px;
    margin-bottom: 20px;
    max-height: 250px;
    overflow-y: auto;
    padding-right: 2px;
  }
  .day-grid::-webkit-scrollbar { width: 4px; }
  .day-grid::-webkit-scrollbar-track { background: var(--surface2); border-radius: 4px; }
  .day-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .day-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text2);
    font-size: 0.8rem;
    padding: 8px 4px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
  }
  .day-btn:hover { border-color: var(--accent); color: var(--text); }
  .day-btn.selected { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ── 버튼 공통 ── */
  .btn {
    display: block;
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-size: 0.97rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #5b52e8; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); margin-top: 9px; }
  .btn-secondary:hover { border-color: var(--accent2); color: var(--accent2); }
  .btn-danger { background: rgba(239,68,68,0.12); color: var(--error); border: 1px solid rgba(239,68,68,0.3); margin-top: 9px; }
  .btn-danger:hover { background: rgba(239,68,68,0.22); }

  .info-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--text2);
    margin-top: 10px;
  }

  /* ── 로딩 ── */
  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: var(--text2);
    padding: 20px 0;
  }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ════════════════════════════
     학습 화면
  ════════════════════════════ */
  #study-day-grid { margin-bottom: 20px; }
  .study-single-select .day-btn.selected { background: var(--accent); border-color: var(--accent); color:#fff; }

  .study-list-container {
    margin-top: 4px;
  }
  .study-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .study-header h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
  }
  .study-header span { font-size: 0.8rem; color: var(--text2); }

  .word-table {
    width: 100%;
    border-collapse: collapse;
  }
  .word-table tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .word-table tr:last-child { border-bottom: none; }
  .word-table tr:hover { background: var(--surface2); }
  .word-table td {
    padding: 10px 8px;
    font-size: 0.9rem;
    vertical-align: middle;
  }
  .word-table td:first-child {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    color: var(--accent2);
    width: 40%;
    word-break: break-all;
  }
  .word-table td:last-child { color: var(--text2); line-height: 1.5; }
  .word-num {
    font-size: 0.72rem;
    color: var(--border);
    font-family: 'Space Grotesk', sans-serif;
    margin-right: 6px;
  }

  /* ════════════════════════════
     퀴즈 화면
  ════════════════════════════ */
  .progress-bar {
    width: 100%; height: 4px;
    background: var(--border); border-radius: 2px;
    margin-bottom: 18px; overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .quiz-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--text2);
    margin-bottom: 22px;
  }
  .quiz-meta .wrong-count { color: var(--error); font-weight: 600; }

  .word-display {
    text-align: center;
    margin-bottom: 24px;
  }
  .word-display .word {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .word-display .day-tag {
    display: inline-block;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 10px;
    font-size: 0.75rem;
    color: var(--text2);
    margin-top: 6px;
    font-family: 'Space Grotesk', sans-serif;
  }

  .tries-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 18px;
  }
  .try-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.2s;
  }
  .try-dot.used { background: var(--error); }

  .answer-input {
    width: 100%;
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 13px 15px;
    font-size: 1rem;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 10px;
  }
  .answer-input:focus { border-color: var(--accent); }
  .answer-input.correct { border-color: var(--success); background: rgba(34,197,94,0.08); }
  .answer-input.wrong   { border-color: var(--error);   background: rgba(239,68,68,0.08); }

  .feedback {
    text-align: center;
    font-size: 0.9rem;
    min-height: 22px;
    margin-bottom: 14px;
    font-weight: 500;
  }
  .feedback.success { color: var(--success); }
  .feedback.error   { color: var(--error); }

  .answer-reveal {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 15px;
    margin-bottom: 14px;
    display: none;
  }
  .answer-reveal.show { display: block; }
  .answer-reveal .rev-label { font-size: 0.72rem; color: var(--text2); margin-bottom: 4px; }
  .answer-reveal .meanings { font-size: 0.93rem; color: var(--accent2); line-height: 1.6; }

  .hint-key {
    font-size: 0.75rem;
    color: var(--text2);
    text-align: center;
    margin-top: 6px;
  }
  .hint-key kbd {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.72rem;
    font-family: monospace;
  }

  /* ── 결과 ── */
  .result-header { text-align: center; margin-bottom: 22px; }
  .result-header .emoji { font-size: 2.8rem; margin-bottom: 6px; }
  .result-header h2 { font-family:'Space Grotesk',sans-serif; font-size:1.5rem; font-weight:700; }
  .result-header p { color: var(--text2); margin-top: 3px; font-size:0.9rem; }

  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 9px;
    margin-bottom: 22px;
  }
  .score-cell {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px;
    text-align: center;
  }
  .score-cell .num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.7rem;
    font-weight: 700;
  }
  .score-cell .num.green { color: var(--success); }
  .score-cell .num.red   { color: var(--error); }
  .score-cell .num.blue  { color: var(--accent2); }
  .score-cell .lbl { font-size: 0.72rem; color: var(--text2); margin-top: 2px; }

  .wrong-list h3 { font-size:0.82rem; color:var(--text2); margin-bottom:10px; font-weight:500; }
  .wrong-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 9px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 5px;
    gap: 12px;
  }
  .wrong-item .w { font-family:'Space Grotesk',sans-serif; font-weight:600; color:var(--error); min-width:110px; }
  .wrong-item .m { font-size:0.82rem; color:var(--text2); }

  /* ── 중도포기 확인 모달 ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    width: min(90%, 360px);
    text-align: center;
  }
  .modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
  .modal p  { font-size: 0.88rem; color: var(--text2); margin-bottom: 20px; line-height:1.5; }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btns .btn { margin-top: 0; }

  @media (max-width:400px) {
    .day-grid { grid-template-columns: repeat(5,1fr); }
    .word-display .word { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<header>
  <h1>EBS VOCA 1800</h1>
  <p>단어 암기 &amp; 테스트</p>
</header>

<!-- 탭 -->
<div class="tab-nav" id="tab-nav">
  <button class="tab-btn active" onclick="switchTab('study')">📖 단어 학습</button>
  <button class="tab-btn" onclick="switchTab('quiz')">✏️ 단어 테스트</button>
</div>

<div class="card">

  <!-- 공통 로딩 -->
  <div id="loading">
    <div class="spinner"></div>
    <span>voca.csv 불러오는 중…</span>
  </div>

  <!-- ══════════════════════════
       학습 탭
  ══════════════════════════ -->
  <div id="tab-study" class="hidden">

    <!-- Day 선택 (단일) -->
    <div id="study-select">
      <span class="section-label">학습할 Day를 선택하세요</span>
      <div class="day-grid study-single-select" id="study-day-grid"></div>
      <div class="info-row">
        <span id="study-info">Day를 선택하면 단어 목록이 표시됩니다</span>
      </div>
    </div>

    <!-- 단어 목록 -->
    <div id="study-list" class="hidden study-list-container">
      <div class="study-header">
        <h3 id="study-list-title">Day01</h3>
        <span id="study-word-count"></span>
      </div>
      <table class="word-table" id="word-table"></table>
    </div>

  </div>

  <!-- ══════════════════════════
       퀴즈 탭
  ══════════════════════════ -->
  <div id="tab-quiz" class="hidden">

    <!-- Day 선택 -->
    <div id="quiz-select">
      <span class="section-label">테스트할 Day 선택 (복수 가능)</span>
      <div class="day-grid" id="quiz-day-grid"></div>
      <button class="btn btn-primary" id="btn-start" disabled>테스트 시작</button>
      <div class="info-row">
        <span id="selected-days-info">선택된 Day 없음</span>
        <span id="word-count-info"></span>
      </div>
    </div>

    <!-- 퀴즈 진행 -->
    <div id="screen-quiz" class="hidden">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="quiz-meta">
        <span id="q-counter">1 / 30</span>
        <span class="wrong-count" id="q-wrong-count">❌ 0</span>
      </div>
      <div class="word-display">
        <div class="word" id="q-word">—</div>
        <div class="day-tag" id="q-day"></div>
      </div>
      <div class="tries-dots">
        <div class="try-dot" id="dot0"></div>
        <div class="try-dot" id="dot1"></div>
      </div>
      <input type="text" class="answer-input" id="answer-input"
             placeholder="한국어 뜻을 입력하세요…" autocomplete="off" />
      <div class="feedback" id="feedback"></div>
      <div class="answer-reveal" id="answer-reveal">
        <div class="rev-label">정답</div>
        <div class="meanings" id="reveal-meanings"></div>
      </div>
      <button class="btn btn-primary" id="btn-check">확인</button>
      <button class="btn btn-secondary hidden" id="btn-next">다음 문제 →</button>
      <button class="btn btn-danger" id="btn-quit" onclick="confirmQuit()">중도 포기</button>
      <p class="hint-key" id="enter-hint" style="margin-top:10px">
        <kbd>Enter</kbd> 확인 &nbsp;|&nbsp; 정답·오답 후 <kbd>Enter</kbd> 다음 문제
      </p>
    </div>

    <!-- 결과 -->
    <div id="screen-result" class="hidden">
      <div class="result-header">
        <div class="emoji" id="result-emoji">🎉</div>
        <h2 id="result-title">결과</h2>
        <p id="result-sub"></p>
      </div>
      <div class="score-grid">
        <div class="score-cell"><div class="num green" id="r-correct">0</div><div class="lbl">정답</div></div>
        <div class="score-cell"><div class="num red"   id="r-wrong">0</div><div class="lbl">오답</div></div>
        <div class="score-cell"><div class="num blue"  id="r-rate">0%</div><div class="lbl">정답률</div></div>
      </div>
      <div class="wrong-list" id="wrong-list-section">
        <h3 id="wrong-list-title">틀린 단어</h3>
        <div id="wrong-list-items"></div>
      </div>
      <button class="btn btn-primary" id="btn-retry-wrong" style="margin-top:16px" onclick="retryWrong()">틀린 단어만 다시 풀기</button>
      <button class="btn btn-secondary" onclick="goHome()">Day 다시 선택하기</button>
    </div>

  </div><!-- /tab-quiz -->

</div><!-- /card -->

<!-- 중도포기 확인 모달 -->
<div class="modal-overlay hidden" id="quit-modal">
  <div class="modal">
    <h3>테스트를 중단할까요?</h3>
    <p>지금까지의 진행 내용은 저장되지 않아요.<br>Day 선택 화면으로 돌아갑니다.</p>
    <div class="modal-btns">
      <button class="btn btn-secondary" style="margin-top:0" onclick="closeQuitModal()">계속 풀기</button>
      <button class="btn btn-danger"   style="margin-top:0" onclick="doQuit()">중도 포기</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
//  데이터
// ══════════════════════════════════════════
let allWords = {}; // { Day01: [{word, raw}], ... }

async function loadCSV() {
  try {
    const res = await fetch('voca.csv');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    parseCSV(text);
    initUI();
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<p style="color:var(--error);text-align:center">⚠️ voca.csv 파일을 불러오지 못했습니다.<br><small style="color:var(--text2)">${e.message}</small></p>`;
  }
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  for (let i = 1; i < lines.length; i++) {
    const cols = csvLine(lines[i]);
    if (cols.length < 3) continue;
    const day  = cols[0].trim();
    const word = cols[1].trim();
    const raw  = cols[2].trim();
    if (!allWords[day]) allWords[day] = [];
    allWords[day].push({ word, raw, meanings: parseMeanings(raw) });
  }
}

function csvLine(line) {
  const r=[]; let cur='', inQ=false;
  for(const c of line){
    if(c==='"'){inQ=!inQ;}
    else if(c===','&&!inQ){r.push(cur);cur='';}
    else cur+=c;
  }
  r.push(cur); return r;
}

function parseMeanings(raw) {
  const parts = raw.split(/(?=(?:^|,\s*)(?:n\.|v\.|a\.|adv?\.|adj\.|prep\.|conj\.|pron\.|int\.|det\.))/);
  const out = [];
  for(const p of parts){
    const s=p.replace(/^,\s*/,'').trim();
    if(s) out.push(s);
  }
  return out.length ? out : [raw.trim()];
}

function sortedDays() {
  return Object.keys(allWords).sort((a,b)=>
    parseInt(a.replace(/\D/g,'')) - parseInt(b.replace(/\D/g,''))
  );
}

// ══════════════════════════════════════════
//  UI 초기화
// ══════════════════════════════════════════
function initUI() {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('tab-nav').classList.remove('hidden');

  buildStudyDayGrid();
  buildQuizDayGrid();

  switchTab('study');
}

// ══════════════════════════════════════════
//  탭 전환
// ══════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active', (i===0&&tab==='study')||(i===1&&tab==='quiz'));
  });
  document.getElementById('tab-study').classList.toggle('hidden', tab!=='study');
  document.getElementById('tab-quiz').classList.toggle('hidden',  tab!=='quiz');
}

// ══════════════════════════════════════════
//  학습 탭
// ══════════════════════════════════════════
let studyDay = null;

function buildStudyDayGrid() {
  const grid = document.getElementById('study-day-grid');
  grid.innerHTML = '';
  sortedDays().forEach(day => {
    const btn = document.createElement('button');
    btn.className = 'day-btn';
    btn.textContent = day.replace('Day','');
    btn.dataset.day = day;
    btn.onclick = () => selectStudyDay(btn, day);
    grid.appendChild(btn);
  });
}

function selectStudyDay(btn, day) {
  document.querySelectorAll('#study-day-grid .day-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  studyDay = day;
  showStudyList(day);
}

function showStudyList(day) {
  const words = allWords[day] || [];
  document.getElementById('study-list-title').textContent = day;
  document.getElementById('study-word-count').textContent = `${words.length}개 단어`;
  const table = document.getElementById('word-table');
  table.innerHTML = words.map((w,i)=>
    `<tr>
      <td><span class="word-num">${String(i+1).padStart(2,'0')}</span>${w.word}</td>
      <td>${w.raw}</td>
    </tr>`
  ).join('');
  document.getElementById('study-info').textContent = `${day} · ${words.length}개 단어`;
  document.getElementById('study-list').classList.remove('hidden');
}

// ══════════════════════════════════════════
//  퀴즈 탭
// ══════════════════════════════════════════
let selectedDays = new Set();
let quiz=[], current=0, tries=0;
let sessionWrong=[], wrongWords=[];
let answered = false; // 현재 문제 답변 완료 여부

function buildQuizDayGrid() {
  const grid = document.getElementById('quiz-day-grid');
  grid.innerHTML = '';
  sortedDays().forEach(day => {
    const btn = document.createElement('button');
    btn.className = 'day-btn';
    btn.textContent = day.replace('Day','');
    btn.dataset.day = day;
    btn.onclick = () => toggleDay(btn, day);
    grid.appendChild(btn);
  });
}

function toggleDay(btn, day) {
  if(selectedDays.has(day)){selectedDays.delete(day);btn.classList.remove('selected');}
  else{selectedDays.add(day);btn.classList.add('selected');}
  updateStartBtn();
}
function updateStartBtn() {
  const count = [...selectedDays].reduce((s,d)=>s+(allWords[d]?.length||0),0);
  document.getElementById('btn-start').disabled = selectedDays.size===0;
  document.getElementById('selected-days-info').textContent =
    selectedDays.size ? `${selectedDays.size}개 Day 선택됨` : '선택된 Day 없음';
  document.getElementById('word-count-info').textContent =
    count ? `총 ${count}개 → 30문제 출제` : '';
}

document.getElementById('btn-start').onclick = () => startQuiz(false);

function startQuiz(retryMode) {
  let pool = [];
  if(retryMode){
    pool = wrongWords.map(w=>({...w}));
  } else {
    wrongWords = [];
    for(const day of selectedDays)
      pool.push(...(allWords[day]||[]).map(w=>({...w,day})));
  }
  // shuffle
  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  quiz = pool.slice(0,30);
  current = 0;
  sessionWrong = [];

  document.getElementById('quiz-select').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  loadQuestion();
}

function loadQuestion() {
  tries = 0;
  answered = false;
  const q = quiz[current];
  const total = quiz.length;

  document.getElementById('progress-fill').style.width = `${(current/total)*100}%`;
  document.getElementById('q-counter').textContent = `${current+1} / ${total}`;
  document.getElementById('q-wrong-count').textContent = `❌ ${sessionWrong.length}`;
  document.getElementById('q-word').textContent = q.word;
  document.getElementById('q-day').textContent = q.day || '';

  const inp = document.getElementById('answer-input');
  inp.value=''; inp.className='answer-input'; inp.disabled=false;
  inp.focus();

  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('answer-reveal').classList.remove('show');
  document.getElementById('btn-check').classList.remove('hidden');
  document.getElementById('btn-next').classList.add('hidden');
  document.getElementById('dot0').className='try-dot';
  document.getElementById('dot1').className='try-dot';
}

function checkCurrentAnswer() {
  if(answered) return;
  const inp = document.getElementById('answer-input');
  const val = inp.value.trim();
  if(!val) return;

  const q = quiz[current];
  const ok = isCorrect(val, q.meanings, q.raw);

  if(ok) {
    inp.classList.add('correct');
    document.getElementById('feedback').textContent = '🎉 정답입니다!';
    document.getElementById('feedback').className = 'feedback success';
    // 정답도 answer reveal 표시
    revealAnswer(q);
    markAnswered();
  } else {
    tries++;
    document.getElementById(`dot${tries-1}`).classList.add('used');
    if(tries>=2) {
      inp.classList.add('wrong');
      document.getElementById('feedback').textContent='❌ 오답! 정답을 확인하세요.';
      document.getElementById('feedback').className='feedback error';
      revealAnswer(q);
      if(!sessionWrong.find(w=>w.word===q.word)) sessionWrong.push(q);
      if(!wrongWords.find(w=>w.word===q.word)) wrongWords.push({...q});
      markAnswered();
    } else {
      inp.classList.add('wrong');
      document.getElementById('feedback').textContent='❌ 틀렸습니다. 한 번 더 시도하세요.';
      document.getElementById('feedback').className='feedback error';
      setTimeout(()=>{
        inp.classList.remove('wrong');
        inp.value='';
        document.getElementById('feedback').textContent='';
        document.getElementById('feedback').className='feedback';
        inp.focus();
      }, 850);
    }
  }
}

function markAnswered() {
  answered = true;
  document.getElementById('answer-input').disabled = true;
  document.getElementById('btn-check').classList.add('hidden');
  document.getElementById('btn-next').textContent =
    current+1 >= quiz.length ? '결과 보기 →' : '다음 문제 →';
  document.getElementById('btn-next').classList.remove('hidden');
  document.getElementById('btn-next').focus();
}

function revealAnswer(q) {
  document.getElementById('answer-reveal').classList.add('show');
  document.getElementById('reveal-meanings').innerHTML =
    q.meanings.map(m=>`<span>${m}</span>`).join('<br>');
}

// Enter 키 핸들링
document.getElementById('answer-input').addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  e.preventDefault();
  if(!answered) {
    checkCurrentAnswer();
  } else {
    goNext();
  }
});

document.getElementById('btn-check').onclick = checkCurrentAnswer;
document.getElementById('btn-next').onclick = goNext;

function goNext() {
  current++;
  if(current>=quiz.length) showResult();
  else loadQuestion();
}

// ── 중도 포기 ──
function confirmQuit() {
  document.getElementById('quit-modal').classList.remove('hidden');
}
function closeQuitModal() {
  document.getElementById('quit-modal').classList.add('hidden');
  // 입력창에 포커스 복구
  if(!answered) document.getElementById('answer-input').focus();
  else document.getElementById('btn-next').focus();
}
function doQuit() {
  document.getElementById('quit-modal').classList.add('hidden');
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('quiz-select').classList.remove('hidden');
  // Day 버튼 선택 상태 초기화
  selectedDays.clear();
  document.querySelectorAll('#quiz-day-grid .day-btn').forEach(b=>b.classList.remove('selected'));
  updateStartBtn();
}

// ── 결과 ──
function showResult() {
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');

  const total=quiz.length, wrong=sessionWrong.length, correct=total-wrong;
  const rate=Math.round((correct/total)*100);
  document.getElementById('r-correct').textContent=correct;
  document.getElementById('r-wrong').textContent=wrong;
  document.getElementById('r-rate').textContent=rate+'%';

  const emoji = rate===100?'🏆':rate>=80?'🎉':rate>=60?'👍':'📚';
  const title = rate===100?'완벽해요!':rate>=80?'잘 했어요!':rate>=60?'괜찮아요!':'더 연습해요!';
  document.getElementById('result-emoji').textContent=emoji;
  document.getElementById('result-title').textContent=title;
  document.getElementById('result-sub').textContent=`${total}문제 중 ${correct}개 정답`;

  const listEl=document.getElementById('wrong-list-items');
  listEl.innerHTML='';
  const btn=document.getElementById('btn-retry-wrong');
  if(sessionWrong.length===0){
    document.getElementById('wrong-list-section').style.display='none';
    btn.style.display='none';
  } else {
    document.getElementById('wrong-list-section').style.display='block';
    document.getElementById('wrong-list-title').textContent=`틀린 단어 (${sessionWrong.length}개)`;
    btn.style.display='block';
    sessionWrong.forEach(w=>{
      const d=document.createElement('div');
      d.className='wrong-item';
      d.innerHTML=`<span class="w">${w.word}</span><span class="m">${w.raw}</span>`;
      listEl.appendChild(d);
    });
  }
}

function retryWrong() { if(wrongWords.length) startQuiz(true); }
function goHome() {
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('quiz-select').classList.remove('hidden');
}

// ── 정답 판단 ──
function isCorrect(input, meanings, raw) {
  const norm = s => s
    .replace(/[a-z]+\.\s*/g,'')
    .replace(/[^\uAC00-\uD7A3a-zA-Z0-9\s]/g,'')
    .replace(/\s+/g,' ').trim().toLowerCase();
  const inp = norm(input);
  if(!inp) return false;
  const candidates = new Set();
  for(const m of [...meanings, raw]){
    const c=norm(m);
    candidates.add(c);
    for(const s of c.split(/[,\/]/)){const t=s.trim();if(t)candidates.add(t);}
  }
  return [...candidates].some(c=>c===inp||c.includes(inp)||inp.includes(c));
}
